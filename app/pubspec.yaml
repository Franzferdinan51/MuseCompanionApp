name: muse_companion
description: "Muse Companion - a full-color Muse gadget companion app for Android (iOS, macOS and Windows to follow)."
publish_to: 'none'

version: 0.2.2+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Gadget protocol crypto: X25519, AES-GCM, SHA-256/HMAC/HKDF, ECDH P-256.
  cryptography: ^2.7.0
  # REST calls (device API) and character-image downloads.
  http: ^1.3.0
  # Encrypted on-device storage for SDK/device tokens and identity.
  flutter_secure_storage: ^9.2.2
  # Plain settings (theme, display prefs, non-secret state).
  shared_preferences: ^2.3.3
  # Image/character cache directory.
  path_provider: ^2.1.5
  # Runtime permission requests (Bluetooth, notifications).
  permission_handler: 11.4.0
  # Battery level for the device.health command.
  battery_plus: ^6.2.1

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1
  flutter_foreground_task: ^10.0.0
  # 3D avatar rendering (GLB models from the Muse).
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
