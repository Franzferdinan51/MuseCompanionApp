name: muse_companion
description: "Muse Companion - a full-color Muse gadget companion app for Android (iOS, macOS and Windows to follow)."
publish_to: 'none'

version: 0.3.0+12

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Gadget protocol crypto: X25519, AES-GCM, SHA-256/HMAC/HKDF, ECDH P-256.
  cryptography: ^2.7.0
  # REST calls (device API) and character-image downloads.
  http: ^1.3.0
  # Encrypted on-device storage for SDK/device tokens and identity.
  flutter_secure_storage: ^9.2.2
  # Plain settings (theme, display prefs, non-secret state).
  shared_preferences: ^2.3.3
  # Image/character cache directory.
  path_provider: ^2.1.5
  # Runtime permission requests (Bluetooth, notifications).
  permission_handler: 11.4.0
  # On-device wake word detection (openWakeWord TFLite models).
  tflite_flutter: ^0.11.0
  # Battery level for the device.health command.
  battery_plus: ^6.2.1
  # Pre-built agent framework: tool-calling agent loop for the
  # on-device agent, backed by LM Studio OpenAI-compatible API.
  langchain: ^0.9.0
  langchain_openai: ^0.9.0

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1
  flutter_foreground_task: ^10.0.0
  # 3D avatar rendering (GLB models from the Muse).
  model_viewer_plus: ^1.10.0
  # Motion/magnetic-field sensors for sensors.read.
  sensors_plus: ^6.1.0
  # Real-time 3D avatar stage (GLB with animation clips).
  flutter_3d_controller: ^2.3.0
  # Video-clip avatar animation.
  video_player: ^2.9.0
  # OpenRouter TTS playback (plays synthesized MP3 bytes in memory).
  audioplayers: ^6.1.0
  # Rich text in chat bubbles: markdown, code blocks, lists, links.
  flutter_markdown: ^0.7.7
  # Sandboxed HTML/SVG rendering for canvas documents.
  webview_flutter: ^4.14.1
  # Open tapped links from chat messages in the browser.
  url_launcher: ^6.3.1
  # Element type for the markdown code-block builder.
  markdown: ^7.3.0
  flutter_local_notifications: ^22.3.1
  # Receive shared text/images from other apps ("Share to Juno").
  # Pinned to 1.8.1 (2026-10-04): 1.9.0's android/build.gradle uses the
  # Kotlin 2.x `kotlin {}` DSL without applying the Kotlin Gradle plugin,
  # which fails with "Could not find method kotlin()" on our Gradle setup.
  # 1.8.1 applies its own kotlin-android plugin via buildscript and builds.
  receive_sharing_intent: 1.8.1
  # KaTeX math rendering ($...$ inline, $$...$$ block).
  flutter_math_fork: ^0.7.4
  # Mermaid diagrams: rendered to SVG in an offscreen WebView, shown with
  # pinch-to-zoom (flutter_svg), no network needed (mermaid.min.js bundled).
  flutter_svg: ^2.3.0
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_barcode_scanning: ^0.15.0
  mqtt_client: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Fakes for unit tests that touch the documents directory.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/juno-logo-glossy.png
    - assets/brand/juno-bg-glossy.png
    - assets/avatar/juno_typing.mp4
    - assets/avatar/juno_idle.mp4
    - assets/avatar/juno_orb.mp4
    - assets/avatar/juno_talking.mp4
    - assets/avatar/duck.glb
    # Mermaid UMD bundle (MIT, https://github.com/mermaid-js/mermaid)
    # for offline diagram rendering.
    - assets/js/mermaid.min.js
    # openWakeWord TFLite models (Apache 2.0) for Hey Jarvis beta wake word.
    - assets/wake_word/melspectrogram.tflite
    - assets/wake_word/embedding_model.tflite
    - assets/wake_word/hey_jarvis_v0.1.tflite
